<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121617">
  <meta name="description" content="Три мира для нашей следующей настольной ролевой игры. Прочитайте завязки, выберите атмосферу и расскажите, во что хочется сыграть.">
  <title>Выбор сеттинга — SCP, Wolf Among Us, Vampire</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=c5eba6a68e">
  <link rel="stylesheet" href="assets/fonts/settings-fonts.css?v=5baf0ed14a">
  <link rel="stylesheet" href="immersive.css?v=f8485dd128">
  <link rel="preload" href="assets/fonts/Onest-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <script src="site.config.js?v=68a5680077" defer></script>
  <script src="settings/anomalies/setting.js?v=44ac4ef236" defer></script>
  <script src="settings/urban-fantasy/setting.js?v=61e4d1903d" defer></script>
  <script src="settings/vampire/setting.js?v=bd96a815c8" defer></script>
  <script src="app.js?v=f6cb4d1dc7" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>
  <header class="site-header wrap">
    <a class="wordmark" href="#main" aria-label="Выбор сеттинга, в начало">Выбор сеттинга</a>
    <nav aria-label="Основная навигация">
      <a href="#worlds">Миры</a>
      <a href="#dossier">Подробнее</a>
      <a href="#vote" class="nav-action">Мой выбор</a>
    </nav>
  </header>

  <main id="main">
    <h1 id="page-title" class="sr-only">Выбор сеттинга</h1>

    <section id="worlds" class="worlds wrap" aria-label="Три мира на выбор">
      <div id="world-list" class="world-list"></div>
    </section>

    <section id="dossier" class="dossier-section" aria-label="Сеттинги">
      <div id="dossier-content"></div>
    </section>

    <section id="vote" class="vote-section wrap" aria-labelledby="vote-title">
      <div class="vote-intro">
        <h2 id="vote-title">Ваш выбор</h2>
      </div>
      <form id="feedback-form" class="feedback-form">
        <div class="field">
          <label for="player-name">Как к вам обращаться <span class="secondary">(обязательно)</span></label>
          <input id="player-name" name="playerName" autocomplete="nickname" maxlength="60" placeholder="Имя или ник…" required>
        </div>
        <fieldset class="ratings-fieldset">
          <legend>Насколько вам интересен каждый мир?</legend>
          <p id="scale-help" class="sr-only">От 1 — совсем не интересно, до 10 — очень хочу сыграть.</p>
          <div id="interest-list"></div>
        </fieldset>
        <section id="question-reminders" aria-label="Пропущенные вопросы о сеттингах"></section>
        <p id="questions-confirmation" class="sr-only" role="status" aria-live="polite" hidden></p>
        <div class="field">
          <label for="wishes">Что особенно хочется увидеть?</label>
          <textarea id="wishes" name="wishes" rows="3" maxlength="3000" placeholder="Сцены, персонажи, любимые референсы…"></textarea>
        </div>
        <div class="field">
          <label for="boundaries">Что лучше оставить за кадром?</label>
          <textarea id="boundaries" name="boundaries" rows="3" maxlength="3000" placeholder="Темы, сцены, ограничения…"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="button primary">Отправить ответ</button>
          <button type="button" id="download-answer" class="button secondary-button">Скачать .txt</button>
        </div>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        <details id="answer-fallback" hidden>
          <summary>Открыть текст ответа</summary>
          <label for="answer-text" class="field-help">Выделите текст и скопируйте вручную</label>
          <textarea id="answer-text" readonly rows="12"></textarea>
        </details>
        <div class="draft-controls">
          <span id="draft-status" class="sr-only">Черновик сохраняется на устройстве</span>
          <button id="clear-draft" type="button" class="text-button">Очистить черновик</button>
        </div>
      </form>
      <div id="external-form" class="external-form" hidden></div>
    </section>
    <noscript><p class="wrap">Для досье и анкеты нужен JavaScript. Откройте сайт с включённым JavaScript; тексты миров также доступны в папке settings.</p></noscript>
  </main>

  <footer class="site-footer wrap">
    <div><a href="materials.html">Материалы для отбора</a><a href="CREDITS.md">Источники</a></div>
  </footer>
</body>
</html>
